# Publica o jogo no GitHub Pages a cada push na main (roadmap F.11).
# Passos únicos no repositório: Settings > Pages > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # O botão "Enviar pelo GitHub" do formulário de feedback abre uma issue neste repositório.
          BANDEIRADA_FEEDBACK_URL: https://github.com/${{ github.repository }}/issues/new
          # Variáveis do repositório (Settings > Secrets and variables > Actions > Variables); vazias = padrão.
          # BANDEIRADA_SITE_URL: endereço público (ex.: https://bandeirada.alexarnoni.com). Vira canonical e og:url/og:image.
          BANDEIRADA_SITE_URL: ${{ vars.BANDEIRADA_SITE_URL }}
          # BANDEIRADA_GOATCOUNTER: código do site no GoatCounter. Sem ele, nenhuma análise é carregada.
          BANDEIRADA_GOATCOUNTER: ${{ vars.BANDEIRADA_GOATCOUNTER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
