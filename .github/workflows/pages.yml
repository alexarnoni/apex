# Publica o jogo no GitHub Pages a cada push na main (roadmap F.11).
# Passos únicos no repositório: Settings > Pages > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # O botão "Enviar pelo GitHub" do formulário de feedback abre uma issue neste repositório.
          BANDEIRADA_FEEDBACK_URL: https://github.com/${{ github.repository }}/issues/new
          # Variáveis do repositório (Settings > Secrets and variables > Actions > Variables); vazias = padrão.
          # BANDEIRADA_SITE_URL: endereço público (ex.: https://bandeirada.alexarnoni.com). Vira canonical e og:url/og:image.
          BANDEIRADA_SITE_URL: ${{ vars.BANDEIRADA_SITE_URL }}
          # BANDEIRADA_GOATCOUNTER: código do site no GoatCounter. Sem ele, nenhuma análise é carregada.
          BANDEIRADA_GOATCOUNTER: ${{ vars.BANDEIRADA_GOATCOUNTER }}
          # BANDEIRADA_FEEDBACK_ENDPOINT: endereço do Worker de feedback (worker/README.md). Sem ele o formulário só copia.
          BANDEIRADA_FEEDBACK_ENDPOINT: ${{ vars.BANDEIRADA_FEEDBACK_ENDPOINT }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
