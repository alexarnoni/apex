<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bandeirada — console de debug da engine</title>
<style>
  body { font-family: ui-monospace, monospace; background: #111; color: #ddd; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.1rem; color: #fff; }
  button { font: inherit; padding: .5rem 1rem; cursor: pointer; }
  pre { white-space: pre-wrap; font-size: .85rem; line-height: 1.5; }
  .champ { color: #ffd166; }
</style>
</head>
<body>
<h1>Bandeirada — engine rodando no navegador (página de debug, não é o jogo)</h1>
<p>A UI real vem depois. Isto só prova que a engine é isomórfica: os mesmos módulos dos testes Node rodando aqui.</p>
<button id="run">Simular 25 temporadas</button>
<pre id="out"></pre>
<script type="module">
import { createRng } from '../engine/rng.js';
import { createWorld, advanceYear } from '../engine/world.js';
import { resetRookieCounter } from '../engine/drivers.js';
import { TEAMS_F1, DRIVERS_F1 } from '../data/world2026.js';
import { CATEGORIES } from '../data/categories.js';
import { SURNAMES } from '../data/names.js';

const out = document.getElementById('out');
document.getElementById('run').onclick = () => {
  resetRookieCounter();
  const seed = Math.floor(Math.random() * 1e6);
  const rng = createRng(seed);
  const world = createWorld({ teams: TEAMS_F1, drivers: DRIVERS_F1, category: CATEGORIES.f1, names: SURNAMES });
  const lines = ['seed ' + seed, ''];
  for (let s = 0; s < 25; s++) {
    advanceYear(world, rng);
    const h = world.history.at(-1);
    lines.push('T' + h.season + (h.regulation ? ' [REG]' : '      ') +
      '  campeão: ' + h.champion.name + (h.champion.generated ? ' ✦' : '') +
      ' (' + h.champion.age + ')  construtor: ' + h.constructor);
  }
  out.textContent = lines.join('\n');
};
</script>
</body>
</html>
